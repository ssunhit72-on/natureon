<script>
/* Nature.ON 운영관리 웹앱
   - localStorage 기반 단일 HTML 버전
   - 식수 / 매입 / 경비 / 근무·인건비 / 게시판 / 일·월 마감
*/

const OPS_KEY='natureon_ops_v2';

const DEFAULT_BRANCHES=[
  {id:'hq',name:'본사',customer:'Nature.ON 본사',address:'',startDate:'2027-01-01',unitPrice:7000,meals:['조식','중식','석식','야식','특식'],guaranteed:0,manager:'본사관리자',managerId:'hq',managerPw:'1234',active:true},
  {id:'sejong1',name:'세종1지점',customer:'세종1지점',address:'',startDate:'2027-01-01',unitPrice:7000,meals:['중식','석식','야식','특식'],guaranteed:100,manager:'지점관리자',managerId:'branch',managerPw:'1234',active:true},
  {id:'saemangeum',name:'새만금지점',customer:'새만금 사업장',address:'',startDate:'2027-01-01',unitPrice:7000,meals:['중식','석식','야식','특식'],guaranteed:100,manager:'지점관리자',managerId:'branch',managerPw:'1234',active:true},
  {id:'iksan',name:'익산공장점',customer:'익산공장',address:'',startDate:'2027-01-01',unitPrice:7000,meals:['중식','석식','야식','특식'],guaranteed:100,manager:'지점관리자',managerId:'branch',managerPw:'1234',active:true}
];

const defaultOps={
  branches:DEFAULT_BRANCHES,
  users:[
    {id:'u_hq',username:'hq',pw:'1234',role:'hq',name:'본사관리자',branchId:'hq'},
    {id:'u_branch',username:'branch',pw:'1234',role:'branch',name:'지점관리자',branchId:'sejong1'}
  ],
  meals:[], purchases:[], expenses:[], labor:[],
  posts:[
    {id:Date.now(),branchId:'hq',category:'NOTICE',title:'Nature.ON 운영관리 시스템이 시작되었습니다.',writer:'관리자',date:new Date().toISOString().slice(0,10),content:'현장 운영 관련 공지사항을 등록하세요.'}
  ]
};


function defaultPricing(b){
  const base=Number(b?.unitPrice||7000);
  return {
    customer:{breakfast:base,lunch:base,dinner:base,late:base},
    convenience:{name:'간편식',unit:base},
    partners:Array.isArray(b?.partners)?b.partners:[]
  };
}
function ensureBranchPricing(b){
  if(!b)return;
  const d=defaultPricing(b), p=b.pricing||{};
  b.pricing={
    customer:{...d.customer,...(p.customer||{})},
    convenience:{...d.convenience,...(p.convenience||{})},
    partners:Array.isArray(p.partners)?p.partners:[]
  };
  b.unitPrice=Number(b.unitPrice||b.pricing.customer.lunch||7000);
}
function mealPriceOptions(b){
  ensureBranchPricing(b);
  const p=b.pricing;
  return [
    ['고객사 · 조식','고객사','조식',p.customer.breakfast],
    ['고객사 · 중식','고객사','중식',p.customer.lunch],
    ['고객사 · 석식','고객사','석식',p.customer.dinner],
    ['고객사 · 야식','고객사','야식',p.customer.late],
    ['고객사 · 간편식','고객사','간편식',p.convenience.unit],
    ...p.partners.map(x=>[`${x.name}`,'협력사',x.name,Number(x.unit||0)])
  ];
}
function priceForMealType(b,type){
  ensureBranchPricing(b); const p=b.pricing;
  if(type==='조식')return Number(p.customer.breakfast||0);
  if(type==='중식')return Number(p.customer.lunch||0);
  if(type==='석식')return Number(p.customer.dinner||0);
  if(type==='야식')return Number(p.customer.late||0);
  if(type==='간편식')return Number(p.convenience.unit||0);
  const partner=p.partners.find(x=>x.name===type); return Number(partner?.unit||0);
}

function loadOps(){
  // 이전 버전에서 사용한 저장 키를 비교하고 기록이 가장 많은 데이터를 이어받는다.
  const candidates=['natureon_ops_v2','natureone_ops_v2','natureon_ops_v1'].map(key=>{
    try{const value=JSON.parse(localStorage.getItem(key)||'null');return value&&typeof value==='object'?value:null}catch{return null}
  }).filter(Boolean);
  const score=value=>['meals','purchases','expenses','labor','posts'].reduce((n,key)=>n+(Array.isArray(value[key])?value[key].length:0),0)*10+(Array.isArray(value.branches)?value.branches.length:0);
  let raw=candidates.sort((a,b)=>score(b)-score(a))[0]||null;
  raw=raw||JSON.parse(JSON.stringify(defaultOps));
  raw.branches=raw.branches||JSON.parse(JSON.stringify(DEFAULT_BRANCHES));
  raw.branches.forEach(ensureBranchPricing);
  raw.users=raw.users||[
    {id:'u_hq',username:'hq',pw:'1234',role:'hq',name:'본사관리자',branchId:'hq'},
    {id:'u_branch',username:'branch',pw:'1234',role:'branch',name:'지점관리자',branchId:'sejong1'}
  ];
  if(!raw.users.some(u=>u.role==='hq'))raw.users.push({id:'u_hq',username:'hq',pw:'1234',role:'hq',name:'본사관리자',branchId:'hq'});
  if(!raw.users.some(u=>u.role==='branch'))raw.users.push({id:'u_branch',username:'branch',pw:'1234',role:'branch',name:'지점관리자',branchId:'sejong1'});
  ['meals','purchases','expenses','labor','posts'].forEach(k=>raw[k]=Array.isArray(raw[k])?raw[k]:[]);
  // 기존 기록에는 세종1지점을 기본값으로 연결
  ['meals','purchases','expenses','labor'].forEach(k=>raw[k].forEach(x=>{if(!x.branchId)x.branchId='sejong1'}));
  raw.posts.forEach(x=>{if(!x.branchId)x.branchId='hq'});
  localStorage.setItem(OPS_KEY,JSON.stringify(raw));
  return raw;
}
let ops=loadOps();

function saveOps(){localStorage.setItem(OPS_KEY,JSON.stringify(ops));}
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const num=n=>Number(n||0).toLocaleString('ko-KR');
let opsSession=null;

function branchById(id){return ops.branches.find(b=>b.id===id)||ops.branches[0]}
function activeBranches(){return ops.branches.filter(b=>b.active!==false)}
function isHQ(){return opsSession&&opsSession.role==='hq'}
function currentBranchId(){return isHQ()?'hq':(opsSession?.branchId||'sejong1')}
function currentBranch(){return branchById(currentBranchId())}
function branchName(id){return branchById(id)?.name||id||''}

function refreshLoginBranches(){
  const sel=document.getElementById('loginBranch'); if(!sel)return;
  const list=activeBranches();
  sel.innerHTML=list.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
  if(opsSession?.branchId)sel.value=opsSession.branchId;
}
refreshLoginBranches();
function setLoginMode(){
  const employee=document.getElementById('loginMode').value==='branch';
  document.getElementById('loginBranchRow').hidden=!employee;
  document.getElementById('loginId').placeholder=employee?'직원 아이디 입력':'관리자 아이디 입력';
}
setLoginMode();

function requestOpsLogin(){
  if(opsSession){openOps('dashboard');return;}
  refreshLoginBranches();
  document.getElementById('loginOverlay').classList.add('active');
  setTimeout(()=>document.getElementById('loginId').focus(),50);
}
function closeLogin(){document.getElementById('loginOverlay').classList.remove('active')}
function syncOpsVisibility(){
  const signedIn=!!opsSession;



  document.querySelectorAll('.ops-sidebar [data-hq]').forEach(button=>button.hidden=!isHQ());
  if(!signedIn)document.getElementById('opsApp').classList.remove('active');
}

function loginOps(e){
  e.preventDefault();
  const id=document.getElementById('loginId').value.trim();
  const pw=document.getElementById('loginPw').value;
  const mode=document.getElementById('loginMode').value;
  const branchId=document.getElementById('loginBranch').value;
  const u=ops.users.find(x=>x.username===id&&x.pw===pw&&x.role===mode);
  if(!u){alert('아이디 또는 비밀번호가 올바르지 않습니다.');return;}
  const selected=branchById(branchId);
  if(u.role==='hq'){
    opsSession={...u,branchId:'hq'};
  }else{
    // 테스트 편의를 위해 지점관리자는 선택한 지점으로 접속 가능.
    // 실제 운영에서는 사용자에게 고정 branchId를 부여하면 된다.
    opsSession={...u,branchId:selected.id};
  }
  sessionStorage.setItem('natureon_ops_session',JSON.stringify(opsSession));
  closeLogin(); syncOpsVisibility(); openOps('dashboard');
}
function logoutOps(){
  opsSession=null;
  sessionStorage.removeItem('natureon_ops_session');
  localStorage.removeItem('natureon_demo_session');
  localStorage.removeItem('natureone_demo_session');
  window.location.replace('index.html');
}
try{opsSession=JSON.parse(sessionStorage.getItem('natureon_ops_session')||'null')}catch(e){opsSession=null}
if(opsSession&&!ops.users.some(u=>u.username===opsSession.username&&u.role===opsSession.role))opsSession=null;
if(opsSession)document.getElementById('loginMode').value=opsSession.role==='hq'?'hq':'branch';
setLoginMode();
syncOpsVisibility();

function requireHQ(){
  if(!isHQ()){alert('본사관리자 전용 메뉴입니다.');return false}
  return true;
}
function scoped(arr){
  if(isHQ())return arr;
  return arr.filter(x=>x.branchId===currentBranchId());
}
function allOrScopedPosts(){
  if(isHQ())return ops.posts;
  return ops.posts.filter(x=>!x.branchId||x.branchId==='hq'||x.branchId===currentBranchId());
}

function openOps(view='dashboard'){
  if(!opsSession){requestOpsLogin();return;}
  if(['settings','branches','news','gallery'].includes(view)&&!isHQ()){alert('본사관리자 전용 메뉴입니다.');return;}
  const el=document.getElementById('opsApp'); if(!el)return;
  el.classList.add('active'); el.scrollIntoView({behavior:'smooth',block:'start'});
  document.querySelectorAll('.ops-sidebar button').forEach(b=>b.classList.toggle('active',b.dataset.op===view));
  const titles={
    dashboard:'운영 대시보드',board:'내부 게시판',meal:'식수 관리',purchase:'매입 관리',
    expense:'경비 관리',labor:'근무·인건비',closing:'일·월 마감',
    branches:'지점 관리',branchSettings:'지점 설정',settings:'설정·백업',news:'홈페이지 소식 관리',gallery:'사내갤러리 관리'
  };
  document.getElementById('opsTitle').textContent=titles[view]||'운영 대시보드';
  const info=document.getElementById('opsUserInfo');
  if(info)info.innerHTML=`<span class="role-badge">${isHQ()?'본사관리자':'지점관리자'} · ${currentBranch().name}</span><button class="ops-logout" onclick="logoutOps()">로그아웃</button>`;
  const box=document.getElementById('opsContent');
  if(view==='closing'&&!isHQ()){
    renderBranchClosing(box); return;
  }
  const renderer={dashboard:renderDashboard,board:renderBoard,meal:renderMeal,purchase:renderPurchase,expense:renderExpense,labor:renderLabor,closing:renderClosing,branches:renderBranches,branchSettings:renderBranchSettings,settings:renderSettings,news:renderPublicNewsAdmin,gallery:renderGalleryAdmin}[view]||renderDashboard;
  renderer(box);
}

function card(title,body){return `<div class="ops-card"><h3>${title}</h3>${body}</div>`}

function renderDashboard(box){
  const today=new Date().toISOString().slice(0,10), ym=today.slice(0,7);
  const meals=scoped(ops.meals).filter(x=>x.date===today);
  const mealCount=meals.reduce((a,x)=>a+Number(x.actual||x.billable||0),0);
  const sales=meals.reduce((a,x)=>a+Number(x.billable||x.actual||0)*Number(x.unit||currentBranch().unitPrice||7000),0);
  const purchase=scoped(ops.purchases).filter(x=>x.date?.slice(0,7)===ym).reduce((a,x)=>a+Number(x.amount||0),0);
  const expense=scoped(ops.expenses).filter(x=>x.date?.slice(0,7)===ym).reduce((a,x)=>a+Number(x.amount||0),0);
  const labor=scoped(ops.labor).filter(x=>x.date?.slice(0,7)===ym).reduce((a,x)=>a+Number(x.amount||0),0);
  const posts=allOrScopedPosts().slice().reverse().slice(0,5);
  const branchSummary=isHQ()?activeBranches().filter(b=>b.id!=='hq').map(b=>{
    const ms=ops.meals.filter(x=>x.branchId===b.id&&x.date?.slice(0,7)===ym);
    const rev=ms.reduce((a,x)=>a+Number(x.billable||x.actual||0)*Number(x.unit||b.unitPrice||7000),0);
    const pu=ops.purchases.filter(x=>x.branchId===b.id&&x.date?.slice(0,7)===ym).reduce((a,x)=>a+Number(x.amount||0),0);
    const ex=ops.expenses.filter(x=>x.branchId===b.id&&x.date?.slice(0,7)===ym).reduce((a,x)=>a+Number(x.amount||0),0);
    const la=ops.labor.filter(x=>x.branchId===b.id&&x.date?.slice(0,7)===ym).reduce((a,x)=>a+Number(x.amount||0),0);
    return `<tr><td>${b.name}</td><td>${num(ms.reduce((a,x)=>a+Number(x.billable||x.actual||0),0))}식</td><td>${won(rev)}</td><td>${won(pu)}</td><td>${won(la)}</td><td>${won(rev-pu-ex-la)}</td></tr>`;
  }).join(''):'';

  box.innerHTML=`
  <div class="ops-permission">현재 권한: <b>${isHQ()?'본사관리자':'지점관리자'}</b> · ${currentBranch().name} · ${isHQ()?'전체 지점 통합조회':'담당 지점 데이터만 조회·입력'}</div>
  <div class="ops-grid">
    <div class="ops-stat"><small>오늘 식수</small><strong>${num(mealCount)}식</strong></div>
    <div class="ops-stat"><small>오늘 예상매출</small><strong>${won(sales)}</strong></div>
    <div class="ops-stat"><small>이번달 매입</small><strong>${won(purchase)}</strong></div>
    <div class="ops-stat"><small>이번달 운영비</small><strong>${won(expense+labor)}</strong></div>
  </div>
  ${isHQ()?card('지점별 운영 현황',`<div style="overflow:auto"><table class="ops-table"><tr><th>지점</th><th>청구식수</th><th>매출</th><th>식재료</th><th>인건비</th><th>예상이익</th></tr>${branchSummary||'<tr><td colspan="6">등록된 지점이 없습니다.</td></tr>'}</table></div>`):''}
  ${card('최근 게시판',`<table class="ops-table"><tr><th>구분</th><th>제목</th><th>작성자</th><th>일자</th></tr>${posts.map(p=>`<tr><td>${p.category}</td><td>${p.title}</td><td>${p.writer}</td><td>${p.date}</td></tr>`).join('')||'<tr><td colspan="4">게시글이 없습니다.</td></tr>'}</table>`)}
  ${card('이번 달 손익 요약',`<table class="ops-table"><tr><th>항목</th><th>금액</th></tr>
  <tr><td>매출</td><td>${won(scoped(ops.meals).filter(x=>x.date?.slice(0,7)===ym).reduce((a,x)=>a+Number(x.billable||x.actual||0)*Number(x.unit||currentBranch().unitPrice||7000),0))}</td></tr>
  <tr><td>식재료 매입</td><td>${won(purchase)}</td></tr><tr><td>경비</td><td>${won(expense)}</td></tr><tr><td>인건비</td><td>${won(labor)}</td></tr></table>`)}
  `;
}

function renderBoard(box){
  const posts=allOrScopedPosts().slice().reverse();
  box.innerHTML=`${card('게시글 등록',`<form class="ops-form" onsubmit="addPost(event)">
    <label>구분<select id="pCat"><option>NOTICE</option><option>WORK</option><option>FIELD</option><option>FOOD</option></select></label>
    <label class="wide">제목<input id="pTitle" required></label>
    <label>작성자<input id="pWriter" value="${isHQ()?'본사관리자':'지점관리자'}"></label>
    <label class="full">내용<textarea id="pContent"></textarea></label>
    <div class="full"><button class="ops-primary">게시글 등록</button></div></form>`)}
  ${card('게시글 목록',`<table class="ops-table"><tr><th>구분</th><th>제목</th><th>작성자</th><th>지점</th><th>일자</th><th></th></tr>${posts.map(p=>`<tr><td>${p.category}</td><td>${p.title}</td><td>${p.writer}</td><td>${branchName(p.branchId)}</td><td>${p.date}</td><td>${(isHQ()||p.branchId===currentBranchId())?`<button class="ops-danger" onclick="deletePost(${p.id})">삭제</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">게시글이 없습니다.</td></tr>'}</table>`)}
  `;
}
function addPost(e){
  e.preventDefault();
  ops.posts.push({id:Date.now(),branchId:currentBranchId(),category:pCat.value,title:pTitle.value,writer:pWriter.value,date:new Date().toISOString().slice(0,10),content:pContent.value});
  saveOps();openOps('board');
}
function deletePost(id){
  if(confirm('이 게시글을 삭제할까요?')){ops.posts=ops.posts.filter(x=>x.id!==id);saveOps();openOps('board')}
}

function dataForm(type,labels){
  return `<form class="ops-form" onsubmit="addRecord(event,'${type}')">
  ${labels.map(([id,label,type2='text',wide=false])=>`<label class="${wide?'wide':''}">${label}<input id="f_${id}" type="${type2}" ${type2==='number'?'step="1" min="0"':''} required></label>`).join('')}
  <div class="full"><button class="ops-primary">등록</button></div></form>`;
}
function weekMonday(v){
  const d=new Date(v+'T00:00:00'); const day=d.getDay(); const diff=day===0?-6:1-day; d.setDate(d.getDate()+diff); return d.toISOString().slice(0,10);
}
function weekDates(mon){
  const a=[]; const d=new Date(mon+'T00:00:00');
  for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);a.push(x.toISOString().slice(0,10));} return a;
}
function shortDay(date){return ['일','월','화','수','목','금','토'][new Date(date+'T00:00:00').getDay()]}
function renderMeal(box){
  const b=currentBranch(); ensureBranchPricing(b); const p=b.pricing;
  const today=new Date().toISOString().slice(0,10), monday=weekMonday(today), dates=weekDates(monday);
  const priceCards=`<div class="ops-grid">
    <div class="ops-stat"><small>고객사 조식</small><strong>${won(p.customer.breakfast)}</strong></div>
    <div class="ops-stat"><small>고객사 중식</small><strong>${won(p.customer.lunch)}</strong></div>
    <div class="ops-stat"><small>고객사 석식</small><strong>${won(p.customer.dinner)}</strong></div>
    <div class="ops-stat"><small>고객사 야식</small><strong>${won(p.customer.late)}</strong></div>
  </div>`;
  const partnerRows=p.partners.map(x=>`<tr><td>협력사</td><td>${x.name}</td><td>${won(x.unit)}</td><td><button class="ops-light" onclick="editPartner('${x.id}')">수정</button> <button class="ops-danger" onclick="deletePartner('${x.id}')">삭제</button></td></tr>`).join('');
  const partnerBox=card('협력사 단가 관리',`<form class="ops-form" onsubmit="savePartner(event)">
    <label>협력사명<input id="partnerName" required placeholder="예: 협력사A"></label>
    <label>식단가<input id="partnerUnit" type="number" min="0" required placeholder="7000"></label>
    <input id="partnerId" type="hidden"><div class="full"><button class="ops-primary">협력사 저장</button></div>
  </form><div style="overflow:auto;margin-top:15px"><table class="ops-table"><tr><th>구분</th><th>업체</th><th>식단가</th><th>관리</th></tr>${partnerRows||'<tr><td colspan="4">등록된 협력사가 없습니다.</td></tr>'}</table></div>`);
  const opts=mealPriceOptions(b);
  const weeklyRows=opts.map((o,ri)=>{
    const cells=dates.map((dt,di)=>`<td class="week-cell"><input type="number" min="0" id="wk_${ri}_${di}_actual" placeholder="실제"><input type="number" min="0" id="wk_${ri}_${di}_billable" placeholder="청구"><input type="number" min="0" id="wk_${ri}_${di}_guaranteed" placeholder="보장" value="${b.guaranteed||0}"></td>`).join('');
    return `<tr><th class="week-type">${o[0]}<br><small>${won(o[3])}</small></th>${cells}</tr>`;
  }).join('');
  const dayHeads=dates.map((d,i)=>`<th>${['월','화','수','목','금','토','일'][i]}<br><small>${d.slice(5)}</small></th>`).join('');
  box.innerHTML=`<div class="ops-permission">${b.name} · <b>주간 식수 입력</b> · 월요일~일요일 단위로 한 주의 식수를 한 번에 입력합니다.</div>
  ${card('식단가 현황',priceCards+`<div class="note-box"><b>구분1</b> 고객사 조식·중식·석식·야식 &nbsp; <b>구분2</b> 고객사 간편식 &nbsp; <b>구분3+</b> 협력사별 단가</div>`)}
  ${card('주간 식수 등록',`<div class="ops-form" style="margin-bottom:12px"><label>주 시작일(월)<input id="mealWeekStart" type="date" value="${monday}" onchange="renderMeal(document.getElementById('opsContent'))"></label></div>
    <div class="note-box">입력방법: 각 칸에 <b>실제식수 / 청구식수 / 보장식수</b> 순서로 입력합니다. 저장하면 월~일 7일 데이터가 각각 식수 실적으로 등록됩니다.</div>
    <div style="overflow:auto;margin-top:12px"><table class="ops-table week-meal-table"><tr><th>식수구분</th>${dayHeads}</tr>${weeklyRows}</table></div>
    <div style="margin-top:14px"><button class="ops-primary" onclick="saveWeeklyMeals()">월~일 주간 식수 저장</button></div>`)}
  ${partnerBox}
  ${card('입력 내역',`<div style="overflow:auto"><table class="ops-table"><tr><th>날짜</th><th>구분</th><th>실제</th><th>보장</th><th>청구</th><th>단가</th><th></th></tr>${scoped(ops.meals).slice().reverse().slice(0,100).map(r=>`<tr><td>${r.date||''}</td><td>${r.type||''}</td><td>${num(r.actual)}</td><td>${num(r.guaranteed)}</td><td>${num(r.billable)}</td><td>${won(r.unit)}</td><td><button class="ops-danger" onclick="delRecord('meals',${r.id})">삭제</button></td></tr>`).join('')||'<tr><td colspan="7">입력 내역이 없습니다.</td></tr>'}</table></div>`)}
  `;
}
function saveWeeklyMeals(){
  const b=currentBranch(); ensureBranchPricing(b); const start=document.getElementById('mealWeekStart')?.value;
  if(!start){alert('주 시작일을 선택하세요.');return}
  const monday=weekMonday(start), dates=weekDates(monday), opts=mealPriceOptions(b); let count=0;
  opts.forEach((o,ri)=>dates.forEach((dt,di)=>{
    const actual=Number(document.getElementById(`wk_${ri}_${di}_actual`)?.value||0);
    const billable=Number(document.getElementById(`wk_${ri}_${di}_billable`)?.value||0);
    const guaranteed=Number(document.getElementById(`wk_${ri}_${di}_guaranteed`)?.value||0);
    if(actual||billable||guaranteed){
      const type=o[2], unit=Number(o[3]||0);
      ops.meals.push({id:Date.now()+count,branchId:currentBranchId(),date:dt,type,actual,guaranteed,billable,unit,priceGroup:(type==='간편식'?'구분2':(['조식','중식','석식','야식'].includes(type)?'구분1':'구분3+'))}); count++;
    }
  }));
  saveOps(); alert(count?`${count}건의 주간 식수 실적이 저장되었습니다.`:'입력된 식수가 없습니다.'); openOps('meal');
}
function syncMealPrice(){
  const s=document.getElementById('f_type'), u=document.getElementById('f_unit'); if(!s||!u)return;
  u.value=Number(s.selectedOptions[0]?.dataset.price||0);
}
function savePartner(e){
  e.preventDefault(); const b=currentBranch(); ensureBranchPricing(b);
  const name=document.getElementById('partnerName').value.trim(), unit=Number(document.getElementById('partnerUnit').value||0), id=document.getElementById('partnerId').value;
  if(!name){alert('협력사명을 입력하세요.');return}
  const dup=b.pricing.partners.find(x=>x.name===name&&x.id!==id); if(dup){alert('같은 협력사명이 이미 있습니다.');return}
  if(id){const x=b.pricing.partners.find(x=>x.id===id); if(x){x.name=name;x.unit=unit;}}
  else b.pricing.partners.push({id:'pt_'+Date.now(),name,unit});
  saveOps(); openOps('meal');
}
function editPartner(id){
  const b=currentBranch(); ensureBranchPricing(b); const x=b.pricing.partners.find(x=>x.id===id); if(!x)return;
  document.getElementById('partnerName').value=x.name; document.getElementById('partnerUnit').value=x.unit; document.getElementById('partnerId').value=x.id; window.scrollTo({top:document.getElementById('opsApp').offsetTop+120,behavior:'smooth'});
}
function deletePartner(id){
  const b=currentBranch(); ensureBranchPricing(b); const x=b.pricing.partners.find(x=>x.id===id); if(!x)return;
  if(!confirm(`${x.name} 협력사를 삭제할까요?`))return; b.pricing.partners=b.pricing.partners.filter(x=>x.id!==id); saveOps(); openOps('meal');
}

function renderPurchase(box){box.innerHTML=`${card('매입 등록',dataForm('purchases',[['date','날짜','date'],['vendor','거래처'],['item','품목'],['amount','금액','number']]))}${tableRecords(scoped(ops.purchases),[['date','날짜'],['vendor','거래처'],['item','품목'],['amount','금액']],'purchases')}`}
function renderExpense(box){box.innerHTML=`${card('경비 등록',dataForm('expenses',[['date','날짜','date'],['category','구분'],['memo','내용'],['amount','금액','number']]))}${tableRecords(scoped(ops.expenses),[['date','날짜'],['category','구분'],['memo','내용'],['amount','금액']],'expenses')}`}
function renderLabor(box){box.innerHTML=`${card('근무·인건비 등록',dataForm('labor',[['date','날짜','date'],['worker','직원명'],['hours','근무시간','number'],['rate','시급','number'],['amount','급여/비용','number']]))}${tableRecords(scoped(ops.labor),[['date','날짜'],['worker','직원명'],['hours','시간'],['rate','시급'],['amount','금액']],'labor')}`}
function addRecord(e,type){
  e.preventDefault();
  const f=e.target,obj={id:Date.now(),branchId:currentBranchId()};
  f.querySelectorAll('input').forEach(i=>{obj[i.id.replace('f_','')]=i.value});
  if(type==='meals'){ ensureBranchPricing(currentBranch()); obj.unit=Number(obj.unit||priceForMealType(currentBranch(),obj.type)||currentBranch().unitPrice||7000); obj.priceGroup=(obj.type==='간편식'?'구분2':(['조식','중식','석식','야식'].includes(obj.type)?'구분1':'구분3+')); }
  ops[type].push(obj);saveOps();
  openOps(type==='meals'?'meal':type==='purchases'?'purchase':type==='expenses'?'expense':'labor');
}

function calcBranch(bid,ym){
  const b=branchById(bid);
  const meals=ops.meals.filter(x=>x.branchId===bid&&x.date?.slice(0,7)===ym);
  const revenue=meals.reduce((a,x)=>a+Number(x.billable||x.actual||0)*Number(x.unit||b.unitPrice||7000),0);
  const purchase=ops.purchases.filter(x=>x.branchId===bid&&x.date?.slice(0,7)===ym).reduce((a,x)=>a+Number(x.amount||0),0);
  const expense=ops.expenses.filter(x=>x.branchId===bid&&x.date?.slice(0,7)===ym).reduce((a,x)=>a+Number(x.amount||0),0);
  const labor=ops.labor.filter(x=>x.branchId===bid&&x.date?.slice(0,7)===ym).reduce((a,x)=>a+Number(x.amount||0),0);
  return {meals,revenue,purchase,expense,labor,profit:revenue-purchase-expense-labor};
}

 window.renderCustomerConsultations=function(box){
   if(!isHQ())return; const list=read(CQ).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));
   box.innerHTML=card('상담신청 관리',`<p class="news-admin-note">홈페이지 상담신청으로 접수된 업체 정보를 본사관리자 화면에서 확인합니다.</p><div style="overflow:auto"><table class="ops-table"><tr><th>일자</th><th>업체명</th><th>신청자</th><th>연락처</th><th>상태</th><th>관리</th></tr>${list.map(x=>`<tr><td>${esc(x.date||'')}</td><td><b>${esc(x.company)}</b></td><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${status(x.status||'접수')}</td><td><div class="customer-admin-row-actions"><button class="reply" onclick="viewConsultation('${esc(x.id)}')">상세보기</button><button class="done" onclick="completeConsultation('${esc(x.id)}')">상담완료</button><button class="del" onclick="deleteConsultation('${esc(x.id)}')">삭제</button></div></td></tr>`).join('')||'<tr><td colspan="6">접수된 상담신청이 없습니다.</td></tr>'}</table></div><div id="consultationDetail"></div>`)}
 window.viewConsultation=function(id){if(!isHQ())return;const x=read(CQ).find(v=>String(v.id)===String(id));if(!x)return;const d=document.getElementById('consultationDetail');d.innerHTML=`<div class="customer-admin-detail"><h4>${esc(x.company)} · ${esc(x.name)}</h4><div style="font-size:12px;color:#68716b">${esc(x.date||'')} · ${esc(x.phone||'')} ${x.email?'· '+esc(x.email):''}</div><pre>위탁급식 문의/제안\n${esc(x.proposal||'')}\n\n요청사항\n${esc(x.request||'')}\n\n기타 문의\n${esc(x.message||'')}</pre></div>`;d.scrollIntoView({behavior:'smooth',block:'nearest'})}
 window.completeConsultation=function(id){if(!isHQ())return;const all=read(CQ),i=all.findIndex(x=>String(x.id)===String(id));if(i<0)return;all[i].status='상담완료';all[i].completedAt=Date.now();write(CQ,all);renderCustomerConsultations(document.getElementById('opsContent'))}
 window.deleteConsultation=function(id){if(!isHQ()||!confirm('이 상담신청을 삭제할까요?'))return;write(CQ,read(CQ).filter(x=>String(x.id)!==String(id)));renderCustomerConsultations(document.getElementById('opsContent'))}
 const oldOpenOps=window.openOps;
 window.openOps=function(view){
   if(view==='inquiries'||view==='consultations'){
     if(!opsSession){requestOpsLogin();return} if(!isHQ()){alert('본사관리자 전용 메뉴입니다.');return}
     const el=document.getElementById('opsApp');el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'start'});
     document.querySelectorAll('.ops-sidebar button').forEach(b=>b.classList.toggle('active',b.dataset.op===view));
     document.getElementById('opsTitle').textContent=view==='inquiries'?'고객문의 관리':'상담신청 관리';
     document.getElementById('opsUserInfo').innerHTML=`<span class="role-badge">본사관리자 · ${currentBranch().name}</span><button class="ops-logout" onclick="logoutOps()">로그아웃</button>`;
     (view==='inquiries'?renderCustomerInquiries:renderCustomerConsultations)(document.getElementById('opsContent'));return;
   }
   return oldOpenOps(view);
 };
})();
</script><script>window.addEventListener('load',()=>{if(opsSession)openOps('dashboard');else requestOpsLogin()})</script></body></html>
